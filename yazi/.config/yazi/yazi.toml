# yazi.toml
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[mgr]
show_hidden = true

[opener]
edit = [
	{ run = '$EDITOR %s', block = true, for = "unix" },
]
open = [
	{ run = 'xdg-open %s1', desc = "Open", for = "unix" },
]
play = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
]
pdf = [
	{ run = 'zathura %s1', orphan = true, for = "unix" },
]
extract = [
	{ run = 'ouch decompress %s1', desc = "Extract here", for = "unix" },
	# Fallback if you don't use `ouch`:
	# { run = '7z x %s1', desc = "Extract here", for = "unix" },
]

[open]
rules = [
	{ mime = "application/pdf", use = "pdf" },
	{ mime = "{audio,video}/*", use = "play" },
	{ mime = "image/*", use = "open" },
	{ mime = "inode/x-empty", use = "edit" },
  { mime = "application/{zip,x-tar,x-bzip*,x-7z-compressed,x-rar,gzip,zstd}", use = "extract" },
	{ mime = "application/x-{executable,sharedlib}", use = "open" },
	{ mime = "*", use = "edit" },
]
