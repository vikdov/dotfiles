# ~/.config/yazi/keymap.toml
[mgr]
prepend_keymap = [
    { on = ["<C-t>"], run = '''shell --orphan "kitty --directory='$PWD'"''', desc = "Open kitty here (alongside)" },
    { on = ["l"], run = "plugin smart-enter", desc = "Enter dir or open file" },
    { on = ["f"], run = "plugin jump-to-char", desc = "Jump to char" },
]
