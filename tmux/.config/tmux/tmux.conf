# ── Core ──────────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g history-limit 10000
set -g focus-events on

# ── Keybinds ──────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Catppuccin Frappé ─────────────────────────────────────────────────────────
bg="#303446"
fg="#c6d0f5"
surface0="#414559"
surface1="#51576d"
mauve="#ca9ee6"
blue="#8caaee"
subtext0="#a5adce"
overlay0="#737994"

set -g status-style "bg=#{bg},fg=#{fg}"
set -g status-position top
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#{blue},bold] #S #[fg=#{overlay0}]│ "
set -g status-right "#[fg=#{subtext0}]%H:%M #[fg=#{overlay0}]│ #[fg=#{blue}]#H "

set -g window-status-format         " #[fg=#{subtext0}]#I:#W "
set -g window-status-current-format " #[fg=#{mauve},bold]#I:#W "
set -g window-status-separator      ""

set -g pane-border-style        "fg=#{surface1}"
set -g pane-active-border-style "fg=#{mauve}"

set -g message-style "bg=#{surface0},fg=#{fg}"
set -g mode-style    "bg=#{mauve},fg=#{bg}"
