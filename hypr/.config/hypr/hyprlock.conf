# ============================================================================
# Hyprlock Configuration with Music Player Widget
# ============================================================================

# ----------------------------------------------------------------------------
# Background
# ----------------------------------------------------------------------------
$accent = rgba(5BB8E8FF)
$accent_dim = rgba(5BB8E8AA)
$bg = rgba(0D1117FF)
$shadow = rgba(00000088)

general {
    grace = 1
    ignore_empty_input = true
    text_trim = false
    disable_loading_bar = true
}
background {
    monitor =
    path = /tmp/lock_wallpaper.jpg
    blur_passes = 0
    blur_size   = 0
    noise       = 0
    brightness  = 1.0
}

# ----------------------------------------------------------------------------
# Animations
# ----------------------------------------------------------------------------
animations {
    animation = fade,    1, 6, default
    animation = fadeIn,  1, 6, default
    animation = fadeOut, 1, 6, default
}

# ----------------------------------------------------------------------------
# Password Input Field
# ----------------------------------------------------------------------------
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.15
    dots_center = true
    outer_color = $accent
    inner_color = $bg
    font_color = $accent
    fade_on_empty = true
    fade_timeout = 800
    placeholder_text = <span font_family="Inter" foreground="#5BB8E8AA"><i>Password...</i></span>
    hide_input = false
    rounding = 8
    check_color = rgba(1793D1FF)
    fail_color = rgba(E06C75FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    position = 0, -90
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Clock & Date Display
# ----------------------------------------------------------------------------

# TIME HR
label {
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $accent
    font_size = 150
    font_family = JetBrains Mono
    position = 0, -100
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 3
    shadow_color = $shadow
    shadow_boost = 1.2
    zindex = 3
}
# TIME MIN
label {
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $accent
    font_size = 150
    font_family = JetBrains Mono
    position = 0, -270
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 3
    shadow_color = $shadow
    shadow_boost = 1.2
    zindex = 3
}
# DATE
label {
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = $accent
    font_size = 16
    font_family = Inter
    position = 0, 25
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 3
    shadow_color = $shadow
    shadow_boost = 1.2
    zindex = 3
}


# Lock Icon
label {
    monitor =
    text = <span> </span>
    color = rgba(216, 222, 233, 0.70)
    font_size = 24
    font_family = Inter
    position = 2, -110
    halign = center
    valign = top
}



# ----------------------------------------------------------------------------
# Album Art
# ----------------------------------------------------------------------------
image {
    monitor =
    path = $HOME/.config/hypr/scripts/music.webp
    size = 100
    rounding = 5
    border_size = 3
    border_color = rgba(216, 222, 233, 0.70)
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/hyprlock-music.sh --art
    position = 730, 57
    halign = left
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Player Background Box
# ----------------------------------------------------------------------------
shape {
    monitor =
    color = rgba(100, 114, 125, 0.4)
    size = 500, 140
    rounding = 10
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 0
}

# ----------------------------------------------------------------------------
# Track Information
# ----------------------------------------------------------------------------

# Song title
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --title)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 16
    font_family = Inter
    position = 45, 110
    halign = center
    valign = bottom
    zindex = 1
}

# Player source (e.g., Spotify, Firefox)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --player)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 13
    font_family = Inter
    position = 185, 30
    halign = center
    valign = bottom
    zindex = 1
}

# Artist name
label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/hypr/scripts/hyprlock-music.sh --artist)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 12
    font_family = Inter
    position = 45, 95
    halign = center
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Playback Controls
# ----------------------------------------------------------------------------

# Previous track button
label {
    monitor =
    text = 󰒮
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    onclick = playerctl previous
    position = 0, 55
    halign = center
    valign = bottom
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh --status
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    onclick = playerctl play-pause
    position = 50, 13
    halign = center
    valign = bottom
}

# Next track button
label {
    monitor =
    text = 󰒭
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    onclick = playerctl next
    position = 100, 55
    halign = center
    valign = bottom
}

# ----------------------------------------------------------------------------
# Progress Display
# ----------------------------------------------------------------------------

# Current position timestamp
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --position)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 10
    font_family = Inter
    position = -80, 80
    halign = center
    valign = bottom
}

# Total length timestamp
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --length)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 10
    font_family = Inter
    position = 180, 80
    halign = center
    valign = bottom
}

# Progress bar (with Pango markup for colored segments)
label {
    monitor = 
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh --progress-bar
    color = rgba(216, 222, 233, 0.70)
    font_size = 12
    font_family = Inter
    position = 50, 70
    halign = center
    valign = bottom
}

