# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1. Keyboard backlight off after 3 min idle (skip if media playing), restore on resume
listener {
    timeout = 180
    on-timeout = sh -c 'playerctl status 2>/dev/null | grep -q Playing || brightnessctl -sd kbd_backlight set 0'
    on-resume = brightnessctl -rd kbd_backlight 2>/dev/null || true
}

# 2. Warning: locking in 2 minutes
listener {
    timeout = 480
    on-timeout = notify-send "Locking in 2 minutes…" "Move mouse or press a key to cancel" -a hypridle -u low -i system-lock-screen -t 5000
}

# 3. Lock screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 4. Screen off (DPMS) shortly after lock — covers both your external Dell and built-in panel
listener {
    timeout = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 5. Suspend after 20 min idle
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
